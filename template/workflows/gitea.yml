name: Render cheatsheet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Render PDF
        run: nix develop --command quarto render

      # Publish the PDF as a release asset so it gets a direct, stable URL.
      # Artifact links use Gitea's ROOT_URL and are not direct file links.
      - name: Publish PDF as release asset
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          release_id=$(curl -fsS -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$TAG\", \"name\": \"Cheatsheet $TAG\", \"target_commitish\": \"${{ github.sha }}\"}" \
            "$SERVER_URL/api/v1/repos/$REPOSITORY/releases" | jq -r .id)
          curl -fsS -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/pdf" \
            --data-binary @index.pdf \
            "$SERVER_URL/api/v1/repos/$REPOSITORY/releases/$release_id/assets?name=index.pdf"
          pdf_url="$SERVER_URL/$REPOSITORY/releases/download/$TAG/index.pdf"
          echo "PDF: $pdf_url"
          echo "PDF: $pdf_url" >> "$GITHUB_STEP_SUMMARY"
