name: Render cheatsheet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Render PDF
        env:
          REPOSITORY: ${{ github.repository }}
        run: nix develop --command quarto render index.qmd --output "${REPOSITORY##*/}.pdf"

      # Publish the PDF as a release asset so it gets a direct download URL.
      # Artifact links use Gitea's ROOT_URL and are not direct file links.
      - name: Publish PDF as release asset
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${GITEA_TOKEN:?Set the GITEA_TOKEN repository secret with repository write access}"
          pdf_name="${REPOSITORY##*/}.pdf"
          test -f "$pdf_name"
          release_data=$(jq -n --arg tag "$TAG" --arg sha "$COMMIT_SHA" \
            --arg name "${REPOSITORY##*/} $TAG" \
            '{tag_name: $tag, name: $name, target_commitish: $sha}')
          release_id=$(curl -fsS -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$release_data" \
            "$SERVER_URL/api/v1/repos/$REPOSITORY/releases" | jq -er .id)
          pdf_url=$(curl -fsS -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@${pdf_name};type=application/pdf" \
            "$SERVER_URL/api/v1/repos/$REPOSITORY/releases/$release_id/assets" \
            | jq -er .browser_download_url)
          echo "PDF: $pdf_url"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "[Download PDF]($pdf_url)" >> "$GITHUB_STEP_SUMMARY"
          fi
