name: Render cheatsheet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Render PDF
        env:
          REPOSITORY: ${{ github.repository }}
        run: nix develop --command quarto render index.qmd --output "${REPOSITORY##*/}.pdf"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-pdf
          path: ${{ github.event.repository.name }}.pdf
