name: Render cheatsheet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Render PDF
        run: nix develop --command quarto render

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: cheatsheet-pdf
          path: "*.pdf"
